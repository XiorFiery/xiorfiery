<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizMaster — Học tập thông minh</title>
<style>
:root{
 --site-primary:#2563EB;--site-secondary:#DBEAFE;--site-background:#F4F8FF;
 --site-on-primary:#FFFFFF;--site-on-secondary:#173B75;--site-on-background:#14213D;
 --site-font-body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --site-font-heading:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --site-heading-scale:1;--site-spacing-scale:1;--site-radius-scale:1;--site-decoration-opacity:1;
 --surface:light-dark(#FFFFFF,#172235);--surface-soft:light-dark(#F7FAFF,#1D2B42);
 --ink:light-dark(#14213D,#F1F5FC);--muted:light-dark(#64748B,#A8B7CC);
 --line:light-dark(#E2EAF5,#34445D);--good:#15803D;--bad:#DC2626;--shadow:0 12px 35px rgba(31,74,137,.08);
}
*{box-sizing:border-box} body{margin:0;background:var(--site-background);color:var(--ink);font-family:var(--site-font-body)}
#app{min-height:100vh;width:100%;border-radius:0;background-color:var(--site-background);color:var(--site-on-background);position:relative;overflow:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer}.topbar{height:72px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:20px;letter-spacing:-.5px}.brandmark{width:38px;height:38px;border-radius:12px;background:var(--site-primary);color:white;display:grid;place-items:center;font-weight:900;box-shadow:0 6px 15px #2563eb44}.brand span:last-child{color:var(--site-primary)}
.nav{display:flex;gap:8px;align-items:center}.nav button,.tab{border:0;background:transparent;color:var(--muted);padding:10px 14px;border-radius:10px;font-weight:650}.nav button.active,.tab.active{background:var(--site-secondary);color:var(--site-on-secondary)}.admin-pill{background:#EFF6FF!important;color:#1D4ED8!important;border:1px solid #BFDBFE!important}
main{max-width:1160px;margin:0 auto;padding:34px 24px 70px}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:24px;align-items:stretch;margin-bottom:26px}.hero-copy{padding:36px;border-radius:24px;background:linear-gradient(125deg,#1D4ED8,#3B82F6 65%,#60A5FA);color:white;position:relative;overflow:hidden;box-shadow:0 18px 40px #2563eb2b}.hero-copy:after{content:"";position:absolute;width:260px;height:260px;border:1px solid #ffffff35;border-radius:50%;right:-75px;top:-100px;box-shadow:0 0 0 28px #ffffff0c,0 0 0 58px #ffffff0a;opacity:var(--site-decoration-opacity)}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.7px;font-weight:800;opacity:.82}.hero h1{font-family:var(--site-font-heading);font-size:calc(38px * var(--site-heading-scale));line-height:1.12;letter-spacing:-1.4px;margin:13px 0}.hero p{max-width:560px;line-height:1.65;color:#EAF2FF;margin:0 0 24px}.primary-btn{background:var(--site-primary);color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:750;box-shadow:0 7px 16px #2563eb2c}.hero .primary-btn{background:white;color:#1D4ED8}.secondary-btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:700}.stats-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}.stats-card h3{margin:0;font-size:15px}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stat{padding:15px;border-radius:15px;background:var(--surface-soft)}.stat strong{display:block;font-size:25px;color:var(--site-primary)}.stat small{color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:30px 0 15px}.section-head h2{margin:0;font-size:22px;letter-spacing:-.5px}.section-head p{margin:5px 0 0;color:var(--muted);font-size:14px}.subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.subject-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;text-align:left;transition:.18s;box-shadow:var(--shadow);color:var(--ink)}.subject-card:hover{transform:translateY(-3px);border-color:#93B4F8}.subject-icon{width:44px;height:44px;border-radius:14px;background:var(--site-secondary);display:grid;place-items:center;font-size:21px;margin-bottom:14px}.subject-card h3{margin:0 0 6px;font-size:16px}.subject-card p{margin:0;color:var(--muted);font-size:13px}.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--site-primary);font-size:13px;font-weight:750}.content-panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);outline:none}.toolbar input:focus,.field input:focus,.field textarea:focus{border-color:var(--site-primary)}.toolbar input{flex:1;min-width:190px}.quiz-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.timer{background:#EFF6FF;color:#1D4ED8;padding:10px 14px;border-radius:12px;font-weight:850;font-variant-numeric:tabular-nums}.progress{height:8px;background:var(--surface-soft);border-radius:20px;overflow:hidden;margin:12px 0 24px}.progress>div{height:100%;background:var(--site-primary);width:0;transition:width .2s}.question-meta{color:var(--muted);font-size:13px;font-weight:700}.question-title{font-size:21px;line-height:1.5;margin:10px 0 20px}.answers{display:grid;gap:11px}.answer{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--ink)}.answer:hover{border-color:#93B4F8;background:var(--surface-soft)}.answer.selected{border:2px solid var(--site-primary);background:var(--site-secondary);color:var(--site-on-secondary);padding:13px}.letter{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-soft);font-weight:800;flex:none}.quiz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.result-score{font-size:54px;font-weight:900;color:var(--site-primary);letter-spacing:-2px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.result-tile{background:var(--surface-soft);padding:15px;border-radius:14px}.result-tile strong{display:block;font-size:22px}.review-item{padding:16px 0;border-bottom:1px solid var(--line)}.review-item:last-child{border:0}.correct-text{color:var(--good);font-weight:750}.wrong-text{color:var(--bad);font-weight:750}
.admin-layout{display:grid;grid-template-columns:210px 1fr;gap:18px}.admin-side{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;height:max-content}.admin-side button{display:block;width:100%;text-align:left;padding:12px;border:0;background:transparent;color:var(--muted);border-radius:10px;font-weight:700}.admin-side button.active{background:var(--site-secondary);color:var(--site-on-secondary)}.admin-main{min-width:0}.admin-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.admin-kpi{background:var(--surface);border:1px solid var(--line);padding:17px;border-radius:15px}.admin-kpi strong{font-size:24px;color:var(--site-primary);display:block}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:750;color:var(--muted)}.field.full{grid-column:1/-1}.field textarea{min-height:76px;resize:vertical}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:750}.small-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font-weight:700}.danger{color:#B91C1C;border-color:#FECACA}.notice{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E40AF;border-radius:12px;padding:13px;font-size:13px;line-height:1.5;margin-bottom:16px}.empty{text-align:center;color:var(--muted);padding:35px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#14213D;color:white;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:10;display:none}.hidden{display:none!important}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:42px}
@media(max-width:800px){.hero{grid-template-columns:1fr}.subject-grid{grid-template-columns:repeat(2,1fr)}.admin-layout{grid-template-columns:1fr}.admin-side{display:flex;overflow:auto}.admin-side button{white-space:nowrap;width:auto}.topbar{padding:0 16px}.nav button{padding:9px}.hero-copy{padding:27px}}
@media(max-width:540px){main{padding:22px 14px 50px}.subject-grid{grid-template-columns:1fr}.nav button:not(.admin-pill){display:none}.hero h1{font-size:32px}.result-grid,.admin-cards{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.question-title{font-size:18px}.quiz-head{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div id="app">
<header class="topbar"><div class="brand"><div class="brandmark">Q</div><div>Quiz<span>Master</span></div></div><nav class="nav"><button id="homeNav" class="active" onclick="showHome()">Trang chủ</button><button onclick="showHistory()">Lịch sử</button><button class="admin-pill" onclick="showAdmin()">⚙ Quản trị</button></nav></header>
<main id="main"></main><div class="toast" id="toast"></div>
</div>
<script>
const seedQuestions=[
 {id:1,subject:'Toán học',level:'Cơ bản',q:'Giá trị của biểu thức 8 × 7 là bao nhiêu?',a:['54','56','ame','64'],correct:1,explain:'8 × 7 = 56.'},
 {id:2,subject:'Toán học',level:'Cơ bản',q:'Nghiệm của phương trình x + 5 = 12 là:',a:['5','6','7','8'],correct:2,explain:'Chuyển 5 sang vế phải: x = 12 − 5 = 7.'},
 {id:3,subject:'Vật lý',level:'Cơ bản',q:'Đơn vị đo cường độ dòng điện trong hệ SI là gì?',a:['Vôn (V)','Ampe (A)','Oát (W)','Jun (J)'],correct:1,explain:'Cường độ dòng điện được đo bằng ampe (A).'},
 {id:4,subject:'Vật lý',level:'Cơ bản',q:'Tốc độ được tính bằng công thức nào?',a:['Quãng đường × thời gian','Quãng đường / thời gian','Thời gian / quãng đường','Khối lượng / thể tích'],correct:1,explain:'Tốc độ v = s/t, với s là quãng đường và t là thời gian.'},
 {id:5,subject:'Hóa học',level:'Cơ bản',q:'Ký hiệu hóa học của nguyên tố oxi là:',a:['Ox','O','Oi','X'],correct:1,explain:'Ký hiệu hóa học của oxi là O.'},
 {id:6,subject:'Hóa học',level:'Cơ bản',q:'Công thức hóa học của nước là:',a:['CO₂','H₂O','O₂','NaCl'],correct:1,explain:'Một phân tử nước gồm hai nguyên tử hiđro và một nguyên tử oxi.'},
 {id:7,subject:'Sinh học',level:'Cơ bản',q:'Bào quan nào được xem là nơi tạo ra phần lớn ATP trong tế bào?',a:['Nhân tế bào','Ribosome','Ti thể','Không bào'],correct:2,explain:'Ti thể là nơi diễn ra phần lớn quá trình hô hấp tế bào tạo ATP.'},
 {id:8,subject:'Tiếng Anh',level:'Cơ bản',q:'Choose the correct form: She ___ to school every day.',a:['go','goes','going','gone'],correct:1,explain:'Chủ ngữ ngôi thứ ba số ít ở thì hiện tại đơn dùng động từ thêm -s/-es.'},
 {id:9,subject:'Lịch sử',level:'Cơ bản',q:'Ngày Quốc khánh Việt Nam là ngày nào?',a:['30/4/1975','2/9/1945','19/8/1945','7/5/1954'],correct:1,explain:'Ngày 2/9/1945, Chủ tịch Hồ Chí Minh đọc Tuyên ngôn Độc lập.'}
];
let questions=load('qm_questions',seedQuestions),history=load('qm_history',[]),screen='home',activeQuiz=[],answers={},current=0,timeLeft=0,timer=null,quizSubject='',adminTab='overview';
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function save(){localStorage.setItem('qm_questions',JSON.stringify(questions));localStorage.setItem('qm_history',JSON.stringify(history))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}
const subjects=[['Toán học','∑','Tư duy logic và giải toán'],['Vật lý','⚡','Khám phá các quy luật tự nhiên'],['Hóa học','⚗','Nguyên tố và phản ứng'],['Sinh học','🧬','Thế giới sinh vật'],['Tiếng Anh','文','Từ vựng và ngữ pháp'],['Lịch sử','🏛','Sự kiện và dấu mốc lịch sử']];
function setNav(id){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(id)document.getElementById(id)?.classList.add('active')}
function showHome(){clearInterval(timer);screen='home';setNav('homeNav');renderHome()}
function renderHome(){let count=history.length,avg=count?Math.round(history.reduce((a,b)=>a+b.percent,0)/count):0;document.getElementById('main').innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">Nền tảng học tập trực tuyến</div><h1>Học thông minh.<br>Tiến bộ mỗi ngày.</h1><p>Luyện tập theo môn học, thử sức với đề thi có giới hạn thời gian và theo dõi hành trình tiến bộ của bạn.</p><button class="primary-btn" onclick="startQuiz('Tất cả')">Bắt đầu làm bài&nbsp; →</button></div><div class="stats-card"><div><h3>📈 Tổng quan học tập</h3><p style="color:var(--muted);font-size:13px;margin:6px 0 18px">Thống kê trên thiết bị này</p></div><div class="stat-grid"><div class="stat"><strong>${count}</strong><small>Lượt làm bài</small></div><div class="stat"><strong>${avg}%</strong><small>Điểm trung bình</small></div><div class="stat"><strong>${questions.length}</strong><small>Câu hỏi hiện có</small></div><div class="stat"><strong>${subjects.length}</strong><small>Môn học</small></div></div></div></section><div class="section-head"><div><h2>Khám phá môn học</h2><p>Chọn môn học bạn muốn luyện tập hôm nay</p></div><button class="secondary-btn" onclick="startQuiz('Tất cả')">Thi tổng hợp →</button></div><section class="subject-grid">${subjects.map(([n,i,d])=>`<button class="subject-card" onclick="startQuiz('${n}')"><div class="subject-icon">${i}</div><h3>${n}</h3><p>${d}</p><div class="card-foot"><span>${questions.filter(q=>q.subject===n).length} câu hỏi</span><span>Luyện tập →</span></div></button>`).join('')}</section><div class="footer">QUIZMASTER · HỌC TẬP CHỦ ĐỘNG MỖI NGÀY</div>`}
function startQuiz(subject){let pool=questions.filter(q=>subject==='Tất cả'||q.subject===subject);if(!pool.length){toast('Môn học này chưa có câu hỏi.');return}activeQuiz=pool.sort(()=>Math.random()-.5).slice(0,Math.min(10,pool.length));answers={};current=0;quizSubject=subject;timeLeft=Math.max(60,activeQuiz.length*45);screen='quiz';setNav(null);renderQuiz();clearInterval(timer);timer=setInterval(()=>{timeLeft--;let el=document.getElementById('timer');if(el)el.textContent=formatTime(timeLeft);if(timeLeft<=0)finishQuiz()},1000)}
function formatTime(s){return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`}
function renderQuiz(){let q=activeQuiz[current];document.getElementById('main').innerHTML=`<div class="quiz-head"><div><div class="question-meta">${esc(quizSubject)} · BÀI LUYỆN TẬP</div><h2 style="margin:5px 0">Bài làm của bạn</h2></div><div class="timer" id="timer">${formatTime(timeLeft)}</div></div><div class="content-panel"><div style="display:flex;justify-content:space-between;gap:10px"><span class="question-meta">CÂU ${current+1} / ${activeQuiz.length}</span><span class="question-meta">${Object.keys(answers).length} câu đã trả lời</span></div><div class="progress"><div style="width:${(current+1)/activeQuiz.length*100}%"></div></div><div class="question-title">${esc(q.q)}</div><div class="answers">${q.a.map((a,i)=>`<button class="answer ${answers[q.id]===i?'selected':''}" onclick="chooseAnswer(${q.id},${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(a)}</span></button>`).join('')}</div><div class="quiz-actions"><button class="secondary-btn" onclick="moveQuestion(-1)" ${current===0?'disabled':''}>← Câu trước</button>${current===activeQuiz.length-1?'<button class="primary-btn" onclick="finishQuiz()">Nộp bài</button>':'<button class="primary-btn" onclick="moveQuestion(1)">Câu tiếp theo →</button>'}</div></div><p style="color:var(--muted);font-size:12px;text-align:center">Bạn có thể quay lại câu trước để thay đổi đáp án. Bài sẽ tự nộp khi hết giờ.</p>`}
function chooseAnswer(id,i){answers[id]=i;renderQuiz()}function moveQuestion(d){current=Math.max(0,Math.min(activeQuiz.length-1,current+d));renderQuiz()}
function finishQuiz(){if(screen!=='quiz')return;clearInterval(timer);let correct=activeQuiz.filter(q=>answers[q.id]===q.correct).length,percent=Math.round(correct/activeQuiz.length*100);let item={date:new Date().toLocaleString('vi-VN'),subject:quizSubject,total:activeQuiz.length,correct,percent,details:activeQuiz.map(q=>({q:q.q,a:q.a,chosen:answers[q.id]??null,correct:q.correct,explain:q.explain}))};history.unshift(item);save();screen='result';renderResult(item)}
function renderResult(r){document.getElementById('main').innerHTML=`<div class="content-panel" style="max-width:850px;margin:auto"><div style="text-align:center"><div class="subject-icon" style="margin:0 auto 14px">🏆</div><div class="eyebrow" style="color:var(--site-primary)">HOÀN THÀNH BÀI THI</div><h2 style="margin:8px 0">Bạn đã hoàn thành!</h2><div class="result-score">${r.percent}%</div><p style="color:var(--muted);margin:0">${r.percent>=80?'Làm tốt lắm! Hãy tiếp tục phát huy.':r.percent>=50?'Bạn đang tiến bộ. Hãy xem lại các câu chưa đúng nhé.':'Đừng nản lòng, xem lời giải và thử lại nhé!'}</p></div><div class="result-grid"><div class="result-tile"><strong>${r.correct}/${r.total}</strong><small>Câu trả lời đúng</small></div><div class="result-tile"><strong>${r.total-r.correct}</strong><small>Câu chưa đúng</small></div><div class="result-tile"><strong>${r.date.split(' ')[1]||'—'}</strong><small>Thời gian hoàn thành</small></div></div><h3>Đáp án và giải thích</h3>${r.details.map((d,i)=>`<div class="review-item"><div class="question-meta">CÂU ${i+1}</div><p style="font-weight:700">${esc(d.q)}</p><p class="${d.chosen===d.correct?'correct-text':'wrong-text'}">Bạn chọn: ${d.chosen===null?'Chưa trả lời': 'ABCD'[d.chosen]+' — '+esc(d.a[d.chosen])}</p><p class="correct-text">Đáp án đúng: ${'ABCD'[d.correct]} — ${esc(d.a[d.correct])}</p><p style="color:var(--muted);font-size:13px;margin-bottom:0">💡 ${esc(d.explain)}</p></div>`).join('')}<div class="quiz-actions"><button class="secondary-btn" onclick="showHome()">Về trang chủ</button><button class="primary-btn" onclick="startQuiz('${esc(r.subject)}')">Làm bài tương tự →</button></div></div>`}
function showHistory(){clearInterval(timer);screen='history';setNav(null);document.getElementById('main').innerHTML=`<div class="section-head"><div><h2>Lịch sử làm bài</h2><p>Các kết quả được lưu trên trình duyệt hiện tại</p></div><button class="secondary-btn" onclick="showHome()">← Trang chủ</button></div><div class="content-panel">${history.length?`<div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>Môn học</th><th>Điểm</th><th>Kết quả</th><th></th></tr></thead><tbody>${history.map((h,i)=>`<tr><td>${esc(h.date)}</td><td>${esc(h.subject)}</td><td><b>${h.percent}%</b></td><td>${h.correct}/${h.total} câu</td><td><button class="small-btn" onclick="viewHistory(${i})">Xem lại</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có bài làm nào. Hãy chọn một môn học để bắt đầu nhé!</div>'}</div>`}
function viewHistory(i){renderResult(history[i]);screen='result'}
function showAdmin(){clearInterval(timer);screen='admin';setNav(null);adminTab='overview';renderAdmin()}
function renderAdmin(){let body='';if(adminTab==='overview'){body=`<div class="admin-cards"><div class="admin-kpi"><strong>${questions.length}</strong><small>Tổng câu hỏi</small></div><div class="admin-kpi"><strong>${history.length}</strong><small>Lượt làm bài</small></div><div class="admin-kpi"><strong>${subjects.length}</strong><small>Môn học mẫu</small></div></div><div class="content-panel"><h3>Chào mừng đến trang quản trị</h3><p style="color:var(--muted);line-height:1.6">Tại đây bạn có thể quản lý ngân hàng câu hỏi và theo dõi kết quả làm bài. Bản thử nghiệm lưu dữ liệu trong trình duyệt của thiết bị này.</p><div class="notice">🔐 Đây là khu vực quản trị mô phỏng để xem trước giao diện. Chưa có đăng nhập bảo mật hoặc đồng bộ dữ liệu giữa nhiều thiết bị.</div><button class="primary-btn" onclick="adminTab='questions';renderAdmin()">Quản lý câu hỏi →</button></div>`}else if(adminTab==='questions'){body=`<div class="content-panel"><h3>Thêm câu hỏi mới</h3><form id="questionForm" class="form-grid"><div class="field"><label>Môn học</label><select name="subject">${subjects.map(s=>`<option>${s[0]}</option>`).join('')}</select></div><div class="field"><label>Mức độ</label><select name="level"><option>Cơ bản</option><option>Trung bình</option><option>Nâng cao</option></select></div><div class="field full"><label>Nội dung câu hỏi</label><textarea name="q" required placeholder="Nhập câu hỏi..."></textarea></div>${[0,1,2,3].map(i=>`<div class="field"><label>Đáp án ${'ABCD'[i]}</label><input name="a${i}" required placeholder="Nhập đáp án ${'ABCD'[i]}"></div>`).join('')}<div class="field"><label>Đáp án đúng</label><select name="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div><div class="field"><label>Giải thích</label><input name="explain" placeholder="Giải thích đáp án đúng"></div><div class="field full"><button class="primary-btn">+ Lưu câu hỏi</button></div></form></div><div class="content-panel" style="margin-top:16px"><h3>Ngân hàng câu hỏi (${questions.length})</h3><div class="table-wrap"><table><thead><tr><th>Môn</th><th>Câu hỏi</th><th>Đáp án</th><th></th></tr></thead><tbody>${questions.map(q=>`<tr><td>${esc(q.subject)}</td><td style="white-space:normal;min-width:230px">${esc(q.q)}</td><td>${'ABCD'[q.correct]}</td><td><button class="small-btn danger" onclick="deleteQuestion(${q.id})">Xóa</button></td></tr>`).join('')}</tbody></table></div></div>`}else{body=`<div class="content-panel"><h3>Kết quả người làm bài</h3>${history.length?`<div class="table-wrap"><table><thead><tr><th>Thời gian</th><th>Môn</th><th>Số câu đúng</th><th>Điểm</th></tr></thead><tbody>${history.map(h=>`<tr><td>${esc(h.date)}</td><td>${esc(h.subject)}</td><td>${h.correct}/${h.total}</td><td><b>${h.percent}%</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có dữ liệu kết quả.</div>'}</div>`}
document.getElementById('main').innerHTML=`<div class="section-head"><div><h2>⚙ Quản trị hệ thống</h2><p>Quản lý nội dung và theo dõi hoạt động</p></div><button class="secondary-btn" onclick="showHome()">← Xem website</button></div><div class="admin-layout"><aside class="admin-side"><button class="${adminTab==='overview'?'active':''}" onclick="adminTab='overview';renderAdmin()">▦ Tổng quan</button><button class="${adminTab==='questions'?'active':''}" onclick="adminTab='questions';renderAdmin()">☷ Ngân hàng câu hỏi</button><button class="${adminTab==='results'?'active':''}" onclick="adminTab='results';renderAdmin()">▤ Kết quả bài thi</button></aside><section class="admin-main">${body}</section></div>`;
let f=document.getElementById('questionForm');if(f)f.onsubmit=e=>{e.preventDefault();let d=new FormData(f),q={id:Date.now(),subject:d.get('subject'),level:d.get('level'),q:d.get('q'),a:[0,1,2,3].map(i=>d.get('a'+i)),correct:Number(d.get('correct')),explain:d.get('explain')||'Chưa có giải thích.'};questions.push(q);save();toast('Đã thêm câu hỏi mới!');renderAdmin()}}
function deleteQuestion(id){if(!confirm('Bạn có chắc muốn xóa câu hỏi này?'))return;questions=questions.filter(q=>q.id!==id);save();renderAdmin();toast('Đã xóa câu hỏi.')}
showHome();
</script></body></html>
